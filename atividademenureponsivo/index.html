<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Responsivo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header class="cabecalho">
            Cabeçalho da página
        </header>

        <div class="centro">
            <nav class="menu">
                Menu de navegação
            </nav>

            <main class="conteudo">
                <h2>Conteúdo principal</h2>
                <p>Cores:</p>
                <ul>
                    <li>#0066aa (tom de azul escuro)</li>
                    <li>#cdf0ff (tom de azul claro)</li>
                    <li>#ff0000 (vermelho)</li>
                    <li>#000000 (preto)</li>
                    <li>#ffffff (branco)</li>
                </ul>
            </main>
        </div>

        <footer class="rodape">
            Rodapé da página
        </footer>
    </div>

</body>
</html>
